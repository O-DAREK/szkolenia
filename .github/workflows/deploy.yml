name: Deploy web17

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to web17
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: web17
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/clients/client1/web17/web
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no"
            git pull origin main > deploy_log.txt 2>&1 || true
            cat deploy_log.txt
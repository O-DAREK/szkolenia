name: Deploy web17

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Konfiguracja klucza SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Wykonanie pull ze sztucznym terminalem
        run: |
          ssh -i ~/.ssh/id_ed25519 web17@${{ secrets.PROD_HOST }} << 'REMOTESSHEOF'
          cd web
          git pull origin main
          REMOTESSHEOF
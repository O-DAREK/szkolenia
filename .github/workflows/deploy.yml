name: Deploy web17

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⎔ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build static export
        run: npm run build

      - name: 📂 Sync out/ to ISPConfig
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.ISP_USER }}
          password: ${{ secrets.ISP_PASSWORD }}
          local-dir: ./out/
          server-dir: /web/

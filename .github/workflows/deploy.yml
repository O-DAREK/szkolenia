name: Deploy web17

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu z repozytorium na maszyne GitHuba
        uses: actions/checkout@v4

      - name: Konfiguracja klucza SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Wrzucenie plikow na serwer przez rsync
        run: |
          rsync -avz --exclude '.git/' --exclude '.github/' ./ web17@${{ secrets.PROD_HOST }}:~/web/
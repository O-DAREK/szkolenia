name: Deploy web17

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu z repozytorium na maszyne GitHuba
        uses: actions/checkout@v4

      - name: Konfiguracja klucza SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Instalacja lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Wrzucenie plikow na serwer przez protokol SFTP (lftp)
        run: |
          lftp -c "
          set sftp:auto-confirm yes
          set sftp:connect-program 'ssh -a -x -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no'
          open sftp://web17@${{ secrets.PROD_HOST }}
          mirror -R --verbose --exclude .git/ --exclude .github/ ./ web/
          "
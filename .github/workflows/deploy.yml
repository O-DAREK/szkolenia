name: Deploy web17

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files to ISPConfig
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.ISP_USER }}
          password: ${{ secrets.ISP_PASSWORD }}
          server-dir: /web/


